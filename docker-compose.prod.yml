# Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Required .env.prod variables:
#   IMAGE_TAG                — release version to deploy (e.g. 1.0.0)
#   MYSQL_ROOT_PASSWORD      — strong root password for MySQL
#   MYSQL_DATABASE           — database name (e.g. struxav2)
#   MYSQL_USER               — app database user
#   MYSQL_PASSWORD           — app database password
#   DATABASE_URL             — full DSN using service name: mysql://user:pass@mysql:3306/struxav2
#   BETTER_AUTH_SECRET       — min 32-char random secret
#   BETTER_AUTH_URL          — public URL of the web app (e.g. https://panel.example.com)
#   CORS_ORIGIN              — allowed CORS origin URL
#   JWT_PRIVATE_KEY          — PEM or base64-encoded private key
#   JWT_PUBLIC_KEY           — PEM or base64-encoded public key
#   DATABASE_ENCRYPTION_KEY  — 64-char hex string
#   APP_URL                  — public URL of the app
#   TURNSTILE_SECRET_KEY     — (optional) Cloudflare Turnstile secret
#   MINIO_ENDPOINT           — internal MinIO URL (e.g. http://minio:9000)
#   MINIO_ACCESS_KEY         — MinIO root user / access key
#   MINIO_SECRET_KEY         — MinIO root password / secret key
#   MINIO_BUCKET             — storage bucket name (default: struxa)

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - struxa

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - struxa

  migrate:
    image: ghcr.io/struxadotcloud/migrate:${IMAGE_TAG}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks:
      - struxa

  web:
    image: ghcr.io/struxadotcloud/dashboard:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_ENV: production
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY}
      APP_URL: ${APP_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-struxa}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    networks:
      - struxa

  watchkeeper:
    image: ghcr.io/struxadotcloud/watchkeeper:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_ENV: production
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY}
      APP_URL: ${APP_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - struxa

volumes:
  mysql_data:
  minio_data:

networks:
  struxa:
    driver: bridge
