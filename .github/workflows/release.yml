name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  release:
    name: Build, Push & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve float tag
        id: tags
        run: echo "float=${{ inputs.prerelease == true && 'nightly' || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dashboard:${{ inputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dashboard:${{ steps.tags.outputs.float }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Build and push watchkeeper
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/watchkeeper/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/watchkeeper:${{ inputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/watchkeeper:${{ steps.tags.outputs.float }}
          cache-from: type=gha,scope=watchkeeper
          cache-to: type=gha,mode=max,scope=watchkeeper

      - name: Build and push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/db/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/migrate:${{ inputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/migrate:${{ steps.tags.outputs.float }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          FEATURES=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -E "^- feat" || true)
          FIXES=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -E "^- fix" || true)
          OTHER=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -Ev "^- (feat|fix)" || true)

          {
            echo "body<<EOF"
            echo "## What's Changed"
            echo ""
            if [ -n "$FEATURES" ]; then
              echo "### Features"
              echo "$FEATURES"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$OTHER" ]; then
              echo "### Other Changes"
              echo "$OTHER"
              echo ""
            fi
            echo "## Docker Images"
            echo ""
            echo '```sh'
            echo "docker pull ghcr.io/${{ env.OWNER }}/dashboard:${{ inputs.version }}"
            echo "docker pull ghcr.io/${{ env.OWNER }}/watchkeeper:${{ inputs.version }}"
            echo "docker pull ghcr.io/${{ env.OWNER }}/migrate:${{ inputs.version }}"
            echo '```'
            echo ""
            echo "## Deploy"
            echo ""
            echo "Set \`IMAGE_TAG=${{ inputs.version }}\` in \`.env.prod\`, then:"
            echo '```sh'
            echo "docker compose -f docker-compose.prod.yml --env-file .env.prod up -d"
            echo '```'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ inputs.prerelease }}
          files: docker-compose.prod.yml
          token: ${{ secrets.GITHUB_TOKEN }}
