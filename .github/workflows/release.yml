name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  release:
    name: Build, Push & Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve float tag
        id: tags
        run: echo "float=${{ inputs.prerelease == true && 'nightly' || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Build and push dashboard
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dashboard:${{ inputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dashboard:${{ steps.tags.outputs.float }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
            COMMIT_SHA=${{ github.sha }}

      - name: Build and push watchkeeper
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/watchkeeper/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/watchkeeper:${{ inputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/watchkeeper:${{ steps.tags.outputs.float }}

      - name: Build and push migrate
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: packages/db/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/migrate:${{ inputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/migrate:${{ steps.tags.outputs.float }}

      - name: Generate changelog
        id: changelog
        run: |
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            # For pre-releases, diff against the immediately preceding tag (stable or pre-release)
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          else
            # For stable releases, diff against the last stable tag so that commits
            # already summarised in pre-releases are included in the full release notes.
            PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "")
          fi

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          FEATURES=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -E "^- feat" || true)
          FIXES=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -E "^- fix" || true)
          OTHER=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -Ev "^- (feat|fix)" || true)

          {
            echo "body<<EOF"
            echo "## What's Changed"
            echo ""
            if [ -n "$FEATURES" ]; then
              echo "### Features"
              echo "$FEATURES"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$OTHER" ]; then
              echo "### Other Changes"
              echo "$OTHER"
              echo ""
            fi
            echo "## Docker Images"
            echo ""
            echo '```sh'
            echo "docker pull ghcr.io/${{ env.OWNER }}/dashboard:${{ inputs.version }}"
            echo "docker pull ghcr.io/${{ env.OWNER }}/watchkeeper:${{ inputs.version }}"
            echo "docker pull ghcr.io/${{ env.OWNER }}/migrate:${{ inputs.version }}"
            echo '```'
            echo ""
            echo "## Deploy"
            echo ""
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              echo "### Install"
              echo '```sh'
              echo "bash <(curl -fsSL https://install.struxa.cloud) --nightly"
              echo '```'
              echo ""
              echo "### Update"
              echo '```sh'
              echo "bash <(curl -fsSL https://install.struxa.cloud) update --nightly"
              echo '```'
            else
              echo "### Install"
              echo '```sh'
              echo "bash <(curl -fsSL https://install.struxa.cloud)"
              echo '```'
              echo ""
              echo "### Update"
              echo '```sh'
              echo "bash <(curl -fsSL https://install.struxa.cloud) update"
              echo '```'
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ inputs.prerelease }}
          files: docker-compose.prod.yml
          token: ${{ secrets.GITHUB_TOKEN }}
