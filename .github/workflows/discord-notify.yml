name: Discord Release Notification

on:
  release:
    types: [published]

jobs:
  notify:
    name: Send Discord Webhook
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and send webhook
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          else
            PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$TAG$" | head -1 || echo "")
          fi

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..${TAG}"
          fi

          REPO="${{ github.repository }}"
          MAX_LINES=5

          # Link #123 references to their GitHub issue/PR (GitHub redirects
          # /issues/N to /pull/N automatically when N is a PR).
          linkify() {
            sed -E "s~(^|[^A-Za-z0-9_])#([0-9]+)~\1[#\2](https://github.com/${REPO}/issues/\2)~g"
          }

          # Keep only the first MAX_LINES entries of a category, appending "…" when trimmed.
          truncate_lines() {
            local input="$1" total
            [ -z "$input" ] && return
            total=$(printf '%s\n' "$input" | wc -l)
            if [ "$total" -gt "$MAX_LINES" ]; then
              printf '%s\n' "$input" | head -n "$MAX_LINES"
              echo "…"
            else
              printf '%s\n' "$input"
            fi
          }

          FEATURES=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -E "^- feat" | linkify || true)
          FIXES=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -E "^- fix" | linkify || true)
          OTHER=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -Ev "^- (feat|fix)" | linkify || true)

          # Resolve the actual GitHub username per commit via the API instead of
          # guessing from the freeform display name, so mentions tag the right account.
          declare -A seen
          CREDITS=""
          while IFS=' ' read -r sha email name; do
            [[ "$email" == *"[bot]"* || "$name" == *"[bot]"* || "$email" == *"github-actions"* ]] && continue
            [[ -n "${seen[$email]:-}" ]] && continue
            seen[$email]=1
            login=$(gh api "repos/${REPO}/commits/${sha}" --jq '.author.login // empty' 2>/dev/null || true)
            CREDITS="${CREDITS}${login:-$name}"$'\n'
          done < <(git log $RANGE --pretty=format:"%H %ae %aN" --no-merges)
          CREDITS=$(printf '%s' "$CREDITS" | sed '/^$/d' | sort -u | sed 's|.*|[@&](https://github.com/&)|')

          FEATURES=$(truncate_lines "$FEATURES")
          FIXES=$(truncate_lines "$FIXES")
          OTHER=$(truncate_lines "$OTHER")
          CREDITS=$(truncate_lines "$CREDITS")

          CHANGELOG=""
          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### Features\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### Bug Fixes\n${FIXES}\n"
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### Other Changes\n${OTHER}\n"
          fi
          if [ -n "$CREDITS" ]; then
            CHANGELOG="${CHANGELOG}### Credits\n${CREDITS}"
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No notable changes."
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            ROLE_ID="1520757652223819871"
            TITLE="## 🚧 [${TAG}](${RELEASE_URL})"
          else
            ROLE_ID="1520472105836347515"
            TITLE="## [${TAG}](${RELEASE_URL})"
          fi

          PAYLOAD=$(jq -n \
            --arg ping "<@&${ROLE_ID}> ${TAG}" \
            --arg title "$TITLE" \
            --arg changelog "$(printf '%b' "$CHANGELOG")" \
            --arg url "$RELEASE_URL" \
            '{
              flags: 32768,
              components: [
                { type: 10, content: $ping },
                {
                  type: 17,
                  spoiler: false,
                  components: [
                    {
                      type: 9,
                      components: [
                        { type: 10, content: $title }
                      ],
                      accessory: {
                        type: 2,
                        style: 5,
                        label: "Changelog",
                        url: $url
                      }
                    },
                    { type: 14, divider: true, spacing: 1 },
                    { type: 10, content: $changelog }
                  ]
                }
              ]
            }')

          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?with_components=true"
