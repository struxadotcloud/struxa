name: Build Check

on:
  pull_request:
    branches:
      - "**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.json'
            go:
              - 'apps/watchkeeper/**'

  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: useblacksmith/setup-bun@d9a9b6b2b9986450eb588fc55d3961ecd4c81c57 # v1
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check-types

  build-web:
    name: Build (Web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: useblacksmith/setup-bun@d9a9b6b2b9986450eb588fc55d3961ecd4c81c57 # v1
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_TELEMETRY_DISABLED: "1"

  build-go:
    name: Build (Go)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/watchkeeper/go.mod

      - name: Build
        run: go build ./...
        working-directory: apps/watchkeeper

  comment:
    name: PR Comment
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [typecheck, build-web, build-go]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Post result comment
        uses: actions/github-script@v7
        with:
          script: |
            const typecheck = '${{ needs.typecheck.outputs.result }}' || 'skipped';
            const buildWeb  = '${{ needs.build-web.outputs.result }}' || 'skipped';
            const buildGo   = '${{ needs.build-go.outputs.result }}' || 'skipped';

            const icon  = (s) => s === 'success' ? '✅' : s === 'skipped' ? '⏭️' : '❌';
            const label = (s) => s === 'success' ? 'passed' : s === 'skipped' ? 'skipped' : 'failed';

            const relevant = [typecheck, buildWeb, buildGo].filter(s => s !== 'skipped');
            const allGood  = relevant.length === 0 || relevant.every(s => s === 'success');
            const header   = allGood
              ? '## ✅ Build checks passed'
              : '## ❌ Build checks failed';

            const run_url = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const rows = [];
            if (typecheck !== 'skipped' || buildWeb !== 'skipped') {
              rows.push(`| Type Check | ${icon(typecheck)} ${label(typecheck)} |`);
              rows.push(`| Build (Web) | ${icon(buildWeb)} ${label(buildWeb)} |`);
            }
            if (buildGo !== 'skipped') {
              rows.push(`| Build (Go) | ${icon(buildGo)} ${label(buildGo)} |`);
            }

            const body = [
              header,
              '',
              '| Check | Status |',
              '|-------|--------|',
              ...rows,
              '',
              `[View run](${run_url}) · commit ${{ github.sha }}`.slice(0, 120),
            ].join('\n');

            const marker = '<!-- struxa-build-check -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body:       marker + '\n' + body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: context.issue.number,
                body:         marker + '\n' + body,
              });
            }
